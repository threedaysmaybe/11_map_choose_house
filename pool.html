<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>房源池</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1b1e24; color: #e8e9ec; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; padding: 12px; }
  .wrap { max-width: 100%; margin: 0 auto; }
  .back { display: inline-block; color: #4fc3f7; text-decoration: none; font-size: 14px; margin-bottom: 10px; }
  h1 { font-size: 19px; margin-bottom: 8px; color: #fff; }
  .empty { color: #8b8f99; padding: 20px; text-align: center; }
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .tabs button { flex: 1; padding: 8px; border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; background: #262a32; color: #a9adb8; font-size: 13px; cursor: pointer; }
  .tabs button.active { background: #2e86de; color: #fff; border-color: #2e86de; }
  .tbl-wrap { overflow-x: auto; background: rgba(255,255,255,0.03); border-radius: 8px; }
  table { border-collapse: collapse; min-width: 100%; }
  th { padding: 6px 5px; border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.07); color: #e8e9ec; font-size: 11px; white-space: nowrap; position: sticky; top: 0; }
  td { padding: 6px 5px; border: 1px solid rgba(255,255,255,0.09); color: #c9ccd3; font-size: 11px; white-space: nowrap; }
  td b { color: #fff; }
  td.wrap { white-space: normal; }
  .xg { color: #4fc3f7; text-decoration: none; font-weight: bold; }
  .op a { color: #4fc3f7; text-decoration: none; margin: 0 2px; font-size: 12px; }
  .op a.danger { color: #e74c3c; }
  .note { color: #ffe082; font-weight: bold; white-space: pre-wrap; padding-left: 1.5em; text-indent: -1.5em; }
  .xq-info { color: #a9adb8; font-size: 10px; line-height: 1.6; white-space: normal; }
  .xq-info .lbl { color: #7f848c; }
  .det-label { color: #8b8f99; font-size: 10px; }
  .det-val { color: #e8e9ec; font-size: 11px; }
  .det-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; margin-bottom: 8px; }
  .det-img { display: flex; overflow-x: auto; gap: 6px; padding-bottom: 4px; }
  .det-img img { width: 120px; height: 88px; object-fit: cover; border-radius: 5px; flex-shrink: 0; }
  /* 列表卡片 */
  .group { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; margin-bottom: 14px; padding: 10px; }
  .group-head { font-weight: bold; font-size: 15px; color: #2ecc71; margin-bottom: 6px; display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
  .group-head a { color: #4fc3f7; text-decoration: none; }
  .gh-info { font-weight: normal; font-size: 12px; color: #a9adb8; }
  .card { background: rgba(255,255,255,0.05); border-radius: 8px; padding: 10px; margin-bottom: 8px; }
  .card .t { color: #fff; font-weight: bold; font-size: 14px; margin-bottom: 4px; }
  .card .row { color: #c9ccd3; font-size: 12px; line-height: 1.8; }
  .card .sp { color: #f0c060; font-weight: bold; font-size: 12px; margin-top: 4px; }
  .card .note { color: #ffe082; font-weight: bold; font-size: 12px; margin-top: 3px; white-space: pre-wrap; padding-left: 1.5em; text-indent: -1.5em; }
  .card .op { margin-top: 6px; font-size: 13px; }
  .card .op a { color: #4fc3f7; text-decoration: none; margin-right: 10px; }
  .card .op a.danger { color: #e74c3c; }
  .tag { display: inline-block; background: rgba(139,195,74,0.15); color: #9ccc65; border: 1px solid rgba(139,195,74,0.4); border-radius: 10px; padding: 1px 7px; font-size: 10px; margin: 1px 3px 1px 0; }
  .tag.r { color: #e74c3c; border-color: rgba(231,76,60,0.4); background: rgba(231,76,60,0.12); }
  .tag.y { color: #f0c060; border-color: rgba(240,192,96,0.4); background: rgba(240,192,96,0.12); }
  /* 手机窄屏：隐藏「对比表格」tab，强制用「完整列表」卡片视图 */
  @media (max-width: 600px) {
    #tabTable { display: none; }
  }
  /* 图片灯箱 */
  #lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 9999; cursor: grab; overflow: hidden; }
  #lightbox img { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 92vw; height: 92vh; object-fit: contain; user-select: none; -webkit-user-drag: none; }
  #lightbox img:active { cursor: grabbing; }
  #lightbox .lb-hint { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); color: #c9ccd3; font-size: 12px; pointer-events: none; }
  #lightbox .lb-arrow { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 60px; line-height: 60px; text-align: center; font-size: 34px; color: #fff; background: rgba(255,255,255,0.1); border-radius: 6px; cursor: pointer; user-select: none; z-index: 10; }
  #lightbox .lb-arrow:hover { background: rgba(255,255,255,0.25); }
  #lightbox #lbPrev { left: 16px; }
  #lightbox #lbNext { right: 16px; }
  #lightbox .lb-count { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); color: #c9ccd3; font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="javascript:history.back()">← 返回</a>
  <h1>🏠 房源池（<span id="poolCount">0</span> 套） <button id="refreshBtn" style="background:#2e86de;border:none;border-radius:6px;color:#fff;padding:4px 12px;font-size:13px;cursor:pointer">📥 缓存最新数据</button></h1>
  <div class="tabs">
    <button id="tabCommunity" class="active">🏘️ 小区对比</button>
    <button id="tabTable">📊 房源表格</button>
    <button id="tabList">📋 完整列表</button>
  </div>
  <div id="communityView"></div>
  <div id="tableView" style="display:none"></div>
  <div id="listView" style="display:none"></div>
</div>
<div id="lightbox"><img id="lightboxImg" src="" alt=""><div id="lbPrev" class="lb-arrow">‹</div><div id="lbNext" class="lb-arrow">›</div><div class="lb-count" id="lbCount"></div><div class="lb-hint">滚轮缩放 · 按住拖动 · 单击关闭</div></div>
<script>
  const GITHUB_TOKEN = ['ghp_','w9uOaLY','MjlBSIM','ASAJ5Pz','UvKT31G','JP4E02RP'].join('');
  const GITHUB_REPO = 'threedaysmaybe/11_map_choose_house';

  const _apiCache = {};
  async function apiReadJson(path) {
    if (_apiCache[path]) return _apiCache[path];
    try {
      const r = await fetch('https://api.github.com/repos/' + GITHUB_REPO + '/contents/' + path, {
        headers: { Authorization: 'token ' + GITHUB_TOKEN, Accept: 'application/vnd.github.v3+json' },
      });
      if (r.status === 404) return { json: null, sha: null };
      if (!r.ok) return null;
      const d = await r.json();
      const result = { json: JSON.parse(decodeURIComponent(escape(atob(d.content.replace(/\s/g, ''))))), sha: d.sha };
      _apiCache[path] = result;
      return result;
    } catch (e) { return null; }
  }
  async function readPool() {
    // 先读 localStorage 缓存（秒开），后台静默拉最新
    let cached = null;
    try { cached = localStorage.getItem('pool_cache'); } catch (e) {}
    if (cached) {
      apiReadJson('data/house_pool.json').then(res => {
        if (res && res.json) { try { localStorage.setItem('pool_cache', JSON.stringify(res.json)); } catch (e) {} }
      }).catch(() => {});
      try { return { pool: JSON.parse(cached).pool || [], sha: null }; } catch (e) {}
    }
    const res = await apiReadJson('data/house_pool.json');
    if (res && res.json) { try { localStorage.setItem('pool_cache', JSON.stringify(res.json)); } catch (e) {} }
    return { pool: (res && res.json && res.json.pool) || [], sha: (res && res.sha) || null };
  }
  async function writePool(pool, sha) {
    const path = 'data/house_pool.json';
    if (!sha) { const r = await apiReadJson(path); if (r && r.sha) sha = r.sha; }
    const body = { message: '调整房源池', content: btoa(unescape(encodeURIComponent(JSON.stringify({ pool })))) };
    if (sha) body.sha = sha;
    const r = await fetch('https://api.github.com/repos/' + GITHUB_REPO + '/contents/' + path, {
      method: 'PUT',
      headers: { Authorization: 'token ' + GITHUB_TOKEN, Accept: 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!r.ok) throw new Error('保存失败 HTTP ' + r.status);
    const result = await r.json();
    // 写成功后同步更新本地缓存 + 内存缓存
    try { localStorage.setItem('pool_cache', JSON.stringify({ pool })); } catch (e) {}
    _apiCache[path] = { json: { pool }, sha: result.content.sha };
    return result;
  }
  function derate(x) { return (x.taoneiArea && x.area) ? ((parseFloat(x.taoneiArea) / parseFloat(x.area)) * 100).toFixed(1) + '%' : '—'; }
  function derateRate(x) { return (x.taoneiArea && x.area) ? (parseFloat(x.taoneiArea) / parseFloat(x.area)) * 100 : null; }
  function rateColor(rate) { return rate >= 90 ? '#2ecc71' : rate >= 85 ? '#f0c060' : '#e74c3c'; }
  function tihuColor(tihu) {
    const m = (tihu || '').match(/(\d+)梯(\d+)户/);
    if (!m) return '';
    const ti = parseInt(m[1]), hu = parseInt(m[2]);
    const ratio = hu / ti;
    return (hu <= 4 && ratio <= 2) ? '#2ecc71' : (hu <= 6 && ratio <= 2.5) ? '#f0c060' : '#e74c3c';
  }
  function volColor(v) { const n = parseFloat(v); if (isNaN(n)) return ''; return n < 2.8 ? '#2ecc71' : n < 4 ? '#f0c060' : '#e74c3c'; }
  function structureColor(s) { return s === '框架结构' ? '#2ecc71' : '#f0c060'; }
  function diyaColor(s) { return s === '无抵押' ? '#2ecc71' : '#e74c3c'; }
  function chanquanColor(s) { return s === '非共有' ? '#2ecc71' : '#f0c060'; }
  function usageColor(s) { return s === '普通住宅' ? '#2ecc71' : '#e74c3c'; }
  function quanshuHtml(s) {
    if (!s) return '—';
    // 按斜杠拆分，只给「拆迁/回迁/安置(红)、公房类(黄)」标色，商品房等不标
    return String(s).split('/').map(tag => {
      if (/拆迁|回迁|安置/.test(tag)) return `<span style="color:#e74c3c;font-weight:bold">${tag}</span>`;
      if (/公房|房改|经适|集资/.test(tag)) return `<span style="color:#f0c060;font-weight:bold">${tag}</span>`;
      return tag;
    }).join('/');
  }
  function colored(v, color) { return color ? `<span style="color:${color};font-weight:bold">${v || '—'}</span>` : (v || '—'); }
  function metroHtml(metro) {
    if (!metro) return '';
    const arr = String(metro).split('　').filter(Boolean);
    if (!arr.length) return '';
    return '<div class="xq-info">' + arr.map(m => `<div style="padding-left:10px;text-indent:-10px">🚇 ${m}</div>`).join('') + '</div>';
  }

  function splitGroups(pool) {
    const groups = [];
    for (const x of pool) {
      const last = groups[groups.length - 1];
      if (last && last.xiaoqu === x.xiaoqu) last.items.push(x);
      else groups.push({ xiaoqu: x.xiaoqu, items: [x] });
    }
    return groups;
  }

  function xqInfoHtml(f, info) {
    let s = '<div class="xq-info">';
    s += `<div><span class="lbl">容积率</span> ${colored(f.volumeRate, volColor(f.volumeRate))}</div>`;
    s += `<div><span class="lbl">绿化</span> ${f.greening || '—'}</div>`;
    s += `<div><span class="lbl">物业</span> ${f.propertyFee || '—'}</div>`;
    s += `<div><span class="lbl">年代</span> ${f.buildYear || '—'}</div>`;
    s += `<div><span class="lbl">权属</span> ${quanshuHtml(f.quanshu)}</div>`;
    if (info && info['建筑类型']) s += `<div><span class="lbl">建筑类型</span> ${info['建筑类型']}</div>`;
    if (info && info['楼栋总数']) s += `<div><span class="lbl">楼栋总数</span> ${info['楼栋总数']}</div>`;
    if (f.metro) s += `<div><span class="lbl">地铁</span></div>` + metroHtml(f.metro);
    s += '</div>';
    return s;
  }

  // 小区对比表格：行=小区，列=指标（红黄绿标色）
  function renderCommunityTable(groups, xqData) {
    const area = document.getElementById('communityView');
    const cols = ['小区', '均价', '容积率', '梯户比', '绿化率', '建成年代', '地铁', '建筑类型', '权属', '物业费', '最近成交', '房源特征'];
    let html = '<div class="tbl-wrap"><table><thead><tr>' + cols.map(c => `<th>${c}</th>`).join('') + '</tr></thead><tbody>';
    groups.forEach((g) => {
      const d = xqData[g.xiaoqu] || {};
      const info = d.info || {};
      const houses = d.houses || [];
      const metro = d.metro || [];
      const deals = d.deals || [];
      // 地铁：1km 内最近 3 个；最近的不在 1km 内则只列 1 个
      let metroHtml = '—';
      if (metro.length) {
        const parsed = metro.map(m => ({ ...m, dist: parseInt(m.distance) || 99999 }));
        const within = parsed.filter(m => m.dist <= 1000);
        const list = within.length ? within.slice(0, 3) : parsed.slice(0, 1);
        metroHtml = list.map(m => `<div>${m.name} ${m.distance}${m.lines ? ' · ' + m.lines : ''}</div>`).join('');
      }
      // 最近成交 3 条：面积 + 总价 + 单价 + 年数 + 日期
      const dealsHtml = deals.slice(0, 3).map(x => {
        const area = (x.面积 || '').replace('平米', '㎡');
        const price = x.成交价 || '';
        const unit = x.成交单价 || '';
        const year = x.建成年份 || '';
        const date = (x.签约日期 || '').slice(5);
        return `<div>${area} ${price} ${unit} ${year} <span style="color:#7f848c">${date}</span></div>`;
      }).join('') || '—';
      const featSet = new Set();
      houses.forEach(h => (h.features || []).forEach(f => featSet.add(f)));
      const tihuSet = new Set();
      houses.forEach(h => { if (h.tihu) tihuSet.add(h.tihu); });
      html += '<tr>';
      html += `<td><a class="xg" href="xiaoqu.html?name=${encodeURIComponent(g.xiaoqu)}" target="_blank">${g.xiaoqu}</a></td>`;
      html += `<td>${d.price ? d.price + '元' : '—'}</td>`;
      html += `<td>${colored(info['容积率'], volColor(info['容积率']))}</td>`;
      html += `<td class="wrap">${[...tihuSet].join(' / ') || '—'}</td>`;
      html += `<td>${info['绿化率'] || '—'}</td>`;
      html += `<td>${info['建成年代'] || '—'}</td>`;
      html += `<td class="wrap">${metroHtml}</td>`;
      html += `<td>${info['建筑类型'] || '—'}</td>`;
      html += `<td>${quanshuHtml(info['交易权属'])}</td>`;
      html += `<td>${info['物业费'] || '—'}</td>`;
      html += `<td class="wrap">${dealsHtml}</td>`;
      html += `<td class="wrap">${[...featSet].slice(0, 8).join(' · ') || '—'}</td>`;
      html += '</tr>';
    });
    html += '</tbody></table></div>';
    area.innerHTML = html;
  }

  function renderTable(groups, noteMap, xqData, xqNoteMap) {
    const area = document.getElementById('tableView');
    let html = '<div class="tbl-wrap"><table><thead><tr>';
    const cols = ['小区', '户型', '面积', '单价', '总价', '楼层', '梯户比', '得房率', '总高', '结构', '朝向', '卖点/备注', '最近成交'];
    html += cols.map(c => `<th>${c}</th>`).join('') + '<th>操作</th></tr></thead><tbody>';
    groups.forEach((g, gi) => {
      const N = g.items.length;
      const d = xqData[g.xiaoqu] || {};
      const info = d.info || {};
      const deals = d.deals || [];
      const xqNotes = xqNoteMap[g.xiaoqu] || [];
      const f = g.items[0];
      g.items.forEach((x, ii) => {
        const dr = derateRate(x);
        const notes = ((noteMap[g.xiaoqu] || {})[x.houseCode] || []).map(t => t.note);
        html += `<tr>`;
        if (ii === 0) {
          html += `<td rowspan="${N}" style="vertical-align:top;white-space:normal">`;
          html += `<a class="xg" href="xiaoqu.html?name=${encodeURIComponent(g.xiaoqu)}" target="_blank">${g.xiaoqu}</a>`;
          html += `<a href="javascript:void(0)" class="groupUp" data-gi="${gi}" style="color:#4fc3f7;text-decoration:none;margin-left:4px">↑</a><a href="javascript:void(0)" class="groupDown" data-gi="${gi}" style="color:#4fc3f7;text-decoration:none;margin-left:2px">↓</a>`;
          html += xqInfoHtml(f, info);
          if (xqNotes.length) html += xqNotes.map(n => `<div class="note" style="white-space:pre-wrap;margin-top:4px">📝 ${n}</div>`).join('');
          html += `</td>`;
        }
        html += `<td>${x.room || '—'}</td>`;
        html += `<td>${x.area || '—'}</td>`;
        html += `<td>${x.unitPrice || '—'}</td>`;
        html += `<td><b>${x.totalPrice || '—'}</b></td>`;
        html += `<td>${x.floor || '—'}</td>`;
        html += `<td>${colored(x.tihu, tihuColor(x.tihu))}</td>`;
        html += `<td>${dr != null ? colored(derate(x), rateColor(dr)) : '—'}</td>`;
        html += `<td>${x.totalFloors || '—'}层</td>`;
        html += `<td>${colored(x.structure, structureColor(x.structure))}</td>`;
        html += `<td>${x.orientation || '—'}</td>`;
        html += `<td class="wrap" style="max-width:150px;line-height:1.6">${x.sellingPoint ? `<div>${x.sellingPoint}</div>` : ''}${notes.length ? notes.map(n => `<div class="note">📝 ${n}</div>`).join('') : (x.note ? `<div class="note">📝 ${x.note}</div>` : '')}</td>`;
        html += `<td class="wrap">${deals[0] ? `${deals[0].签约日期 || ''} ${deals[0].成交价 || ''}`.trim() : '—'}</td>`;
        html += `<td class="op"><a href="${x.url || '#'}" target="_blank">🔗</a><a href="javascript:void(0)" class="rm danger" data-hc="${x.houseCode}">×</a><a href="javascript:void(0)" class="up" data-gi="${gi}" data-ii="${ii}">↑</a><a href="javascript:void(0)" class="down" data-gi="${gi}" data-ii="${ii}">↓</a></td>`;
        html += `</tr>`;
      });
    });
    html += '</tbody></table></div>';
    area.innerHTML = html;
  }

  async function renderList(groups, noteMap, tagMap, xqData, xqNoteMap) {
    const area = document.getElementById('listView');
    let html = '';
    for (const [gi, g] of groups.entries()) {
      const d = xqData[g.xiaoqu] || {};
      const info = d.info || {};
      const curNoteMap = noteMap[g.xiaoqu] || {};
      const curTagMap = tagMap[g.xiaoqu] || {};

      const f = g.items[0];
      const quanshu = info['交易权属'] || f.quanshu;
      html += `<div class="group">`;
      html += `<div class="group-head">🏘️ <a href="xiaoqu.html?name=${encodeURIComponent(g.xiaoqu)}" target="_blank">${g.xiaoqu}</a>（${g.items.length}套）<a href="javascript:void(0)" class="groupUp" data-gi="${gi}" style="color:#4fc3f7;text-decoration:none;margin-left:auto">↑</a><a href="javascript:void(0)" class="groupDown" data-gi="${gi}" style="color:#4fc3f7;text-decoration:none;margin-left:2px">↓</a></div>`;
      const xqNotes = xqNoteMap[g.xiaoqu] || [];
      if (xqNotes.length) html += xqNotes.map(n => `<div class="note" style="white-space:pre-wrap;margin-bottom:6px;padding-left:1.5em;text-indent:-1.5em">📝 ${n}</div>`).join('');
      html += `<div class="gh-info" style="margin-bottom:6px">建筑类型 ${info['建筑类型'] || '—'} · 楼栋 ${info['楼栋总数'] || '—'} · 容积率 ${colored(info['容积率'] || f.volumeRate, volColor(info['容积率'] || f.volumeRate))} · 绿化 ${info['绿化率'] || f.greening || '—'} · 物业 ${info['物业费'] || f.propertyFee || '—'} · ${info['建成年代'] || f.buildYear || '—'} · 权属 ${quanshuHtml(quanshu)}</div>`;
      if (f.metro) html += metroHtml(f.metro);
      // 小区图片
      const xqImgs = (d && d.localImages && d.localImages.length) ? d.localImages : [];
      if (xqImgs.length) html += `<div class="det-img" style="margin-bottom:8px">` + xqImgs.map(img => `<img src="data/ke_xiaoqu/images/${encodeURIComponent(g.xiaoqu)}/${img}" loading="lazy">`).join('') + `</div>`;

      g.items.forEach((x, ii) => {
        const h = (d && d.houses) ? d.houses.find(hh => String(hh.houseCode) === String(x.houseCode)) : null;
        const notes = (curNoteMap[x.houseCode] || []).map(t => t.note);
        const tags = (curTagMap[x.houseCode] || []).map(t => t.tag);
        html += `<div class="card">`;
        html += `<div class="t">${x.room || '?'} ${x.area || '?'}㎡ · ${x.totalPrice || '?'}万 · ${x.unitPrice || '?'}元/㎡</div>`;
        let row = `楼层 ${x.floor || '—'} · ${colored(x.tihu, tihuColor(x.tihu))} · 得房率 ${colored(derate(x), derateRate(x) != null ? rateColor(derateRate(x)) : '')} · 总高 ${x.totalFloors || '—'}层 · ${colored(x.structure, structureColor(x.structure))} · 朝向 ${x.orientation || '—'}`;
        if (h) {
          if (h.diya) row += ` · ${colored(h.diya, diyaColor(h.diya))}`;
          if (h.chanquan) row += ` · ${colored(h.chanquan, chanquanColor(h.chanquan))}`;
          if (h.usage) row += ` · ${colored(h.usage, usageColor(h.usage))}`;
        }
        html += `<div class="row">${row}</div>`;
        const extra = [h ? h.decoration : x.decoration, h ? (h.listTime ? '挂牌' + h.listTime : '') : '', h ? (h.lastTrade ? '上次交易' + h.lastTrade : '') : ''].filter(Boolean).join(' · ');
        if (extra) html += `<div class="row">${extra}</div>`;
        if (x.sellingPoint) html += `<div class="sp">核心卖点：${x.sellingPoint}</div>`;
        if (notes.length) html += notes.map(n => `<div class="note">📝 ${n}</div>`).join('');
        else if (x.note) html += `<div class="note">📝 ${x.note}</div>`;
        if (tags.length) html += `<div style="margin-top:4px">${tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>`;
        else if (x.tags && x.tags.length) html += `<div style="margin-top:4px">${x.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>`;
        // 房源图片
        const hImgs = (h && h.localImages && h.localImages.length) ? h.localImages : [];
        if (hImgs.length) html += `<div class="det-img" style="margin-top:6px">` + hImgs.map(img => `<img src="data/ke_xiaoqu/images/${encodeURIComponent(g.xiaoqu)}/${img}" loading="lazy">`).join('') + `</div>`;
        html += `<div class="op"><a href="${x.url || '#'}" target="_blank">🔗 贝壳</a><a href="javascript:void(0)" class="up" data-gi="${gi}" data-ii="${ii}">↑</a><a href="javascript:void(0)" class="down" data-gi="${gi}" data-ii="${ii}">↓</a><a href="javascript:void(0)" class="rm danger" data-hc="${x.houseCode}">× 移除</a></div>`;
        html += `</div>`;
      });
      html += `</div>`;
    }
    area.innerHTML = html;
  }

  async function renderPool(force) {
    const { pool } = await readPool();
    document.getElementById('poolCount').textContent = pool.length;
    const emptyHtml = '<div class="empty">（房源池为空，去小区里点「＋ 房源池」加入）</div>';
    if (!pool.length) { document.getElementById('tableView').innerHTML = emptyHtml; document.getElementById('listView').innerHTML = ''; return; }
    const groups = splitGroups(pool);

    // 读一个小区的数据：force=true 强制拉最新，否则优先读本地缓存（命中就不发请求）
    async function loadOne(g) {
      const ck = 'pool_xq_' + g.xiaoqu;
      if (!force) {
        try { const c = JSON.parse(localStorage.getItem(ck)); if (c) return c; } catch (e) {}
      }
      const xqData = {}, noteMap = {}, tagMap = {}, xqNotes = [];
      try { const r = await fetch('data/ke_xiaoqu/' + encodeURIComponent(g.xiaoqu) + '.json'); if (r.ok) xqData[g.xiaoqu] = await r.json(); } catch (e) {}
      try {
        const nr = await apiReadJson('data/house_notes/' + encodeURIComponent(g.xiaoqu) + '.json');
        const m = {};
        for (const t of (nr && nr.json && nr.json.notes) || []) (m[t.houseCode] = m[t.houseCode] || []).push(t);
        noteMap[g.xiaoqu] = m;
      } catch (e) {}
      try {
        const tr = await apiReadJson('data/tags/' + encodeURIComponent(g.xiaoqu) + '.json');
        const m = {};
        for (const t of (tr && tr.json && tr.json.tags) || []) (m[t.houseCode] = m[t.houseCode] || []).push(t);
        tagMap[g.xiaoqu] = m;
      } catch (e) {}
      try {
        const xn = await apiReadJson('data/notes/' + encodeURIComponent(g.xiaoqu) + '.json');
        xqNotes.push(...((xn && xn.json && xn.json.notes) ? xn.json.notes.map(t => t.note) : []));
      } catch (e) {}
      const result = { xqData: xqData[g.xiaoqu] || {}, noteMap: noteMap[g.xiaoqu] || {}, tagMap: tagMap[g.xiaoqu] || {}, xqNotes };
      try { localStorage.setItem(ck, JSON.stringify(result)); } catch (e) {}
      return result;
    }
    function merge(arr) {
      const xqData = {}, noteMap = {}, tagMap = {}, xqNoteMap = {};
      groups.forEach((g, i) => {
        const c = arr[i];
        xqData[g.xiaoqu] = c.xqData; noteMap[g.xiaoqu] = c.noteMap; tagMap[g.xiaoqu] = c.tagMap; xqNoteMap[g.xiaoqu] = c.xqNotes;
      });
      return { xqData, noteMap, tagMap, xqNoteMap };
    }

    const data = merge(await Promise.all(groups.map(g => loadOne(g))));
    renderCommunityTable(groups, data.xqData);
    renderTable(groups, data.noteMap, data.xqData, data.xqNoteMap);
    await renderList(groups, data.noteMap, data.tagMap, data.xqData, data.xqNoteMap);
    bindEvents();
  }

  function bindEvents() {
    const area = document.body;
    area.querySelectorAll('.up, .down').forEach(btn => {
      btn.addEventListener('click', async () => {
        const gi = parseInt(btn.dataset.gi, 10), ii = parseInt(btn.dataset.ii, 10);
        const dir = btn.classList.contains('up') ? 'up' : 'down';
        try {
          const { pool, sha } = await readPool();
          const groups = splitGroups(pool);
          const g = groups[gi];
          const j = dir === 'up' ? ii - 1 : ii + 1;
          if (j < 0 || j >= g.items.length) return;
          [g.items[ii], g.items[j]] = [g.items[j], g.items[ii]];
          await writePool(groups.flatMap(x => x.items), sha);
          renderPool();
        } catch (e) { alert('调整失败：' + e.message); }
      });
    });
    area.querySelectorAll('.groupUp, .groupDown').forEach(btn => {
      btn.addEventListener('click', async () => {
        const gi = parseInt(btn.dataset.gi, 10);
        const dir = btn.classList.contains('groupUp') ? 'up' : 'down';
        try {
          const { pool, sha } = await readPool();
          const groups = splitGroups(pool);
          const j = dir === 'up' ? gi - 1 : gi + 1;
          if (j < 0 || j >= groups.length) return;
          [groups[gi], groups[j]] = [groups[j], groups[gi]];
          await writePool(groups.flatMap(x => x.items), sha);
          renderPool();
        } catch (e) { alert('调整失败：' + e.message); }
      });
    });
    area.querySelectorAll('.rm').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('从房源池移除该房源？')) return;
        const hc = btn.dataset.hc;
        try {
          const { pool, sha } = await readPool();
          await writePool(pool.filter(x => x.houseCode !== hc), sha);
          renderPool();
        } catch (e) { alert('移除失败：' + e.message); }
      });
    });
  }

  function switchTab(tab) {
    ['tabCommunity', 'tabTable', 'tabList'].forEach(t => document.getElementById(t).classList.toggle('active', t === tab));
    document.getElementById('communityView').style.display = tab === 'tabCommunity' ? '' : 'none';
    document.getElementById('tableView').style.display = tab === 'tabTable' ? '' : 'none';
    document.getElementById('listView').style.display = tab === 'tabList' ? '' : 'none';
  }
  document.getElementById('tabCommunity').addEventListener('click', () => switchTab('tabCommunity'));
  document.getElementById('tabTable').addEventListener('click', () => switchTab('tabTable'));
  document.getElementById('tabList').addEventListener('click', () => switchTab('tabList'));

  // 手机窄屏：默认切到「小区对比」视图
  if (window.innerWidth <= 600) {
    switchTab('tabCommunity');
  }

  // 缓存最新数据：清掉所有本地缓存 + 强制重新拉取最新并缓存
  document.getElementById('refreshBtn').addEventListener('click', async () => {
    const b = document.getElementById('refreshBtn');
    b.textContent = '📥 缓存中…';
    _apiCache['data/house_pool.json'] = null;
    try {
      localStorage.removeItem('pool_cache');
      Object.keys(localStorage).filter(k => k.indexOf('pool_xq_') === 0).forEach(k => localStorage.removeItem(k));
    } catch (e) {}
    await renderPool(true);
    b.textContent = '📥 缓存最新数据';
  });

  renderPool();

  // 图片灯箱：点击放大 + 滚轮缩放 + 按住拖动 + 箭头翻页 + 单击关闭
  const lb = document.getElementById('lightbox');
  const lbImg = document.getElementById('lightboxImg');
  let st = { scale: 1, tx: 0, ty: 0, dragging: false, moved: false, sx: 0, sy: 0, startTx: 0, startTy: 0 };
  function lbApply() { lbImg.style.transform = `translate(calc(-50% + ${st.tx}px), calc(-50% + ${st.ty}px)) scale(${st.scale})`; }
  let lbSrcs = [], lbIndex = 0;
  function lbShow() {
    lbImg.src = lbSrcs[lbIndex];
    st = { scale: 1, tx: 0, ty: 0, dragging: false, moved: false, sx: 0, sy: 0, startTx: 0, startTy: 0 };
    lbApply();
    document.getElementById('lbCount').textContent = (lbIndex + 1) + ' / ' + lbSrcs.length;
    document.getElementById('lbPrev').style.display = lbIndex > 0 ? 'block' : 'none';
    document.getElementById('lbNext').style.display = lbIndex < lbSrcs.length - 1 ? 'block' : 'none';
  }
  function openLightbox(srcs, index) { lbSrcs = srcs || []; lbIndex = index || 0; lbShow(); lb.style.display = 'block'; }
  function closeLightbox() { lb.style.display = 'none'; }
  function lbPrevFn() { if (lbIndex > 0) { lbIndex--; lbShow(); } }
  function lbNextFn() { if (lbIndex < lbSrcs.length - 1) { lbIndex++; lbShow(); } }
  document.getElementById('lbPrev').addEventListener('click', e => { e.stopPropagation(); lbPrevFn(); });
  document.getElementById('lbNext').addEventListener('click', e => { e.stopPropagation(); lbNextFn(); });
  document.body.addEventListener('click', e => {
    if (e.target.tagName !== 'IMG') return;
    if (e.target.closest('#lightbox')) return;
    const imgs = [...e.target.parentElement.querySelectorAll('img')];
    const srcs = imgs.map(i => i.src);
    openLightbox(srcs, srcs.indexOf(e.target.src));
  });
  lb.addEventListener('wheel', e => {
    e.preventDefault();
    st.scale *= (e.deltaY < 0 ? 1.12 : 0.89);
    st.scale = Math.max(0.4, Math.min(6, st.scale));
    lbApply();
  }, { passive: false });
  lbImg.addEventListener('mousedown', e => {
    st.dragging = true; st.moved = false;
    st.sx = e.clientX; st.sy = e.clientY;
    st.startTx = st.tx; st.startTy = st.ty;
    e.preventDefault();
  });
  window.addEventListener('mousemove', e => {
    if (!st.dragging) return;
    const dx = e.clientX - st.sx, dy = e.clientY - st.sy;
    if (Math.abs(dx) + Math.abs(dy) > 3) st.moved = true;
    st.tx = st.startTx + dx; st.ty = st.startTy + dy;
    lbApply();
  });
  window.addEventListener('mouseup', () => { st.dragging = false; });
  lb.addEventListener('click', e => { if (e.target !== lbImg && !st.moved) closeLightbox(); });
  lbImg.addEventListener('click', e => { if (!st.moved) closeLightbox(); else st.moved = false; });
  window.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeLightbox();
    else if (e.key === 'ArrowLeft') lbPrevFn();
    else if (e.key === 'ArrowRight') lbNextFn();
  });

  // 注册 Service Worker（复用 sw.js，让数据/照片走缓存，加速加载）
  window.addEventListener('load', () => { if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js?v=7').catch(() => {}); });
</script>
