<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>房源池</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1b1e24; color: #e8e9ec; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; padding: 12px; }
  .wrap { max-width: 100%; margin: 0 auto; }
  .back { display: inline-block; color: #4fc3f7; text-decoration: none; font-size: 14px; margin-bottom: 10px; }
  h1 { font-size: 19px; margin-bottom: 10px; color: #fff; }
  .empty { color: #8b8f99; padding: 20px; text-align: center; }
  .tbl-wrap { overflow-x: auto; background: rgba(255,255,255,0.03); border-radius: 8px; }
  table { border-collapse: collapse; min-width: 100%; }
  th { padding: 7px 6px; border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.07); color: #e8e9ec; font-size: 11px; white-space: nowrap; position: sticky; top: 0; }
  td { padding: 6px; border: 1px solid rgba(255,255,255,0.09); color: #c9ccd3; font-size: 11px; white-space: nowrap; }
  td b { color: #fff; }
  .xg { color: #4fc3f7; text-decoration: none; font-weight: bold; }
  .op a { color: #4fc3f7; text-decoration: none; margin: 0 3px; font-size: 12px; }
  .op a.danger { color: #e74c3c; }
  .detail-row td { white-space: normal; background: rgba(255,255,255,0.02); }
  .det-label { color: #8b8f99; font-size: 10px; }
  .det-val { color: #e8e9ec; font-size: 11px; }
  .det-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; margin-bottom: 8px; }
  .det-img { display: flex; overflow-x: auto; gap: 6px; padding-bottom: 4px; }
  .det-img img { width: 120px; height: 88px; object-fit: cover; border-radius: 5px; flex-shrink: 0; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="javascript:history.back()">← 返回</a>
  <h1>🏠 房源池（<span id="poolCount">0</span> 套）</h1>
  <div id="poolArea"></div>
</div>
<script>
  const GITHUB_TOKEN = ['ghp_','w9uOaLY','MjlBSIM','ASAJ5Pz','UvKT31G','JP4E02RP'].join('');
  const GITHUB_REPO = 'threedaysmaybe/11_map_choose_house';

  async function apiReadJson(path) {
    try {
      const r = await fetch('https://api.github.com/repos/' + GITHUB_REPO + '/contents/' + path, {
        headers: { Authorization: 'token ' + GITHUB_TOKEN, Accept: 'application/vnd.github.v3+json' },
      });
      if (r.status === 404) return { json: null, sha: null };
      if (!r.ok) return null;
      const d = await r.json();
      return { json: JSON.parse(decodeURIComponent(escape(atob(d.content.replace(/\s/g, ''))))), sha: d.sha };
    } catch (e) { return null; }
  }
  async function readPool() {
    const res = await apiReadJson('data/house_pool.json');
    return { pool: (res && res.json && res.json.pool) || [], sha: (res && res.sha) || null };
  }
  async function writePool(pool, sha) {
    const path = 'data/house_pool.json';
    if (!sha) { const r = await apiReadJson(path); if (r && r.sha) sha = r.sha; }
    const body = { message: '调整房源池', content: btoa(unescape(encodeURIComponent(JSON.stringify({ pool })))) };
    if (sha) body.sha = sha;
    const r = await fetch('https://api.github.com/repos/' + GITHUB_REPO + '/contents/' + path, {
      method: 'PUT',
      headers: { Authorization: 'token ' + GITHUB_TOKEN, Accept: 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!r.ok) throw new Error('保存失败 HTTP ' + r.status);
    return await r.json();
  }
  function derate(x) { return (x.taoneiArea && x.area) ? ((parseFloat(x.taoneiArea) / parseFloat(x.area)) * 100).toFixed(1) + '%' : '—'; }
  function derateRate(x) { return (x.taoneiArea && x.area) ? (parseFloat(x.taoneiArea) / parseFloat(x.area)) * 100 : null; }
  function rateColor(rate) { return rate >= 90 ? '#2ecc71' : rate >= 85 ? '#f0c060' : '#e74c3c'; }
  function tihuColor(tihu) {
    const m = (tihu || '').match(/(\d+)梯(\d+)户/);
    if (!m) return '';
    const ti = parseInt(m[1]), hu = parseInt(m[2]);
    const ratio = hu / ti;
    return (hu <= 4 && ratio <= 2) ? '#2ecc71' : (hu <= 6 && ratio <= 2.5) ? '#f0c060' : '#e74c3c';
  }
  function volColor(v) { const n = parseFloat(v); if (isNaN(n)) return ''; return n < 2.8 ? '#2ecc71' : n < 4 ? '#f0c060' : '#e74c3c'; }
  function structureColor(s) { return s === '框架结构' ? '#2ecc71' : '#f0c060'; }
  function colored(v, color) { return color ? `<span style="color:${color};font-weight:bold">${v || '—'}</span>` : (v || '—'); }

  function splitGroups(pool) {
    const groups = [];
    for (const x of pool) {
      const last = groups[groups.length - 1];
      if (last && last.xiaoqu === x.xiaoqu) last.items.push(x);
      else groups.push({ xiaoqu: x.xiaoqu, items: [x] });
    }
    return groups;
  }

  async function renderPool() {
    const area = document.getElementById('poolArea');
    const { pool } = await readPool();
    document.getElementById('poolCount').textContent = pool.length;
    if (!pool.length) { area.innerHTML = '<div class="empty">（房源池为空，去小区里点「＋ 房源池」加入）</div>'; return; }
    const groups = splitGroups(pool);

    let html = '<div class="tbl-wrap"><table><thead><tr>';
    const cols = ['小区', '户型', '面积㎡', '单价', '总价', '楼层', '梯户比', '得房率', '总高', '结构', '朝向', '核心卖点'];
    html += cols.map(c => `<th>${c}</th>`).join('') + '<th>操作</th></tr></thead><tbody>';

    groups.forEach((g, gi) => {
      g.items.forEach((x, ii) => {
        const dr = derateRate(x);
        html += `<tr>`;
        html += `<td><a class="xg" href="xiaoqu.html?name=${encodeURIComponent(x.xiaoqu)}" target="_blank">${x.xiaoqu}</a>${ii === 0 ? `<a href="javascript:void(0)" class="groupUp" data-gi="${gi}" style="color:#4fc3f7;text-decoration:none;margin-left:4px">↑</a><a href="javascript:void(0)" class="groupDown" data-gi="${gi}" style="color:#4fc3f7;text-decoration:none;margin-left:2px">↓</a>` : ''}</td>`;
        html += `<td>${x.room || '—'}</td>`;
        html += `<td>${x.area || '—'}</td>`;
        html += `<td>${x.unitPrice || '—'}</td>`;
        html += `<td><b>${x.totalPrice || '—'}</b></td>`;
        html += `<td>${x.floor || '—'}</td>`;
        html += `<td>${colored(x.tihu, tihuColor(x.tihu))}</td>`;
        html += `<td>${dr != null ? colored(derate(x), rateColor(dr)) : '—'}</td>`;
        html += `<td>${x.totalFloors || '—'}层</td>`;
        html += `<td>${colored(x.structure, structureColor(x.structure))}</td>`;
        html += `<td>${x.orientation || '—'}</td>`;
        html += `<td style="max-width:120px;overflow:hidden;text-overflow:ellipsis" title="${x.sellingPoint || ''}">${x.sellingPoint || '—'}</td>`;
        html += `<td class="op"><a href="${x.url || '#'}" target="_blank">🔗</a><a href="javascript:void(0)" class="detBtn" data-xiaoqu="${encodeURIComponent(x.xiaoqu)}">▾小区</a><a href="javascript:void(0)" class="rm danger" data-hc="${x.houseCode}">×</a><a href="javascript:void(0)" class="up" data-gi="${gi}" data-ii="${ii}">↑</a><a href="javascript:void(0)" class="down" data-gi="${gi}" data-ii="${ii}">↓</a></td>`;
        html += `</tr>`;
        html += `<tr class="detail-row" data-detail="${encodeURIComponent(x.xiaoqu)}" style="display:none"><td colspan="13"><div class="det-load" style="color:#8b8f99">加载中…</div></td></tr>`;
      });
    });
    html += '</tbody></table></div>';
    area.innerHTML = html;

    // 展开小区信息 + 照片
    area.querySelectorAll('.detBtn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const xq = decodeURIComponent(btn.dataset.xiaoqu);
        const row = area.querySelector(`tr[data-detail="${btn.dataset.xiaoqu}"]`);
        if (!row) return;
        if (row.style.display !== 'none') { row.style.display = 'none'; return; }
        row.style.display = '';
        const cell = row.querySelector('td');
        try {
          const r = await fetch('data/ke_xiaoqu/' + encodeURIComponent(xq) + '.json?t=' + Date.now());
          const d = await r.json();
          const info = d.info || {};
          const fields = [
            ['容积率', info['容积率'], volColor(info['容积率'])],
            ['绿化率', info['绿化率'], ''],
            ['物业费', info['物业费'], ''],
            ['建成年代', info['建成年代'], ''],
            ['交易权属', info['交易权属'], ''],
            ['房屋总数', info['房屋总数'], ''],
            ['楼栋总数', info['楼栋总数'], ''],
            ['开发商', info['开发商'], ''],
          ];
          let detHtml = '<div class="det-grid">';
          for (const [k, v, c] of fields) detHtml += `<div><span class="det-label">${k}</span><div class="det-val">${colored(v, c)}</div></div>`;
          if (d.metro && d.metro.length) detHtml += `<div><span class="det-label">地铁</span><div class="det-val">${d.metro.map(m => m.name + ' ' + m.distance).join(' · ')}</div></div>`;
          detHtml += '</div>';
          const imgs = (d.localImages && d.localImages.length) ? d.localImages : [];
          if (imgs.length) {
            detHtml += '<div class="det-img">' + imgs.map(img => `<img src="data/ke_xiaoqu/images/${encodeURIComponent(xq)}/${img}" loading="lazy">`).join('') + '</div>';
          } else {
            detHtml += '<div style="color:#8b8f99;font-size:11px">（该小区暂无照片）</div>';
          }
          cell.innerHTML = detHtml;
        } catch (e) {
          cell.innerHTML = '<div style="color:#e74c3c">加载小区信息失败</div>';
        }
      });
    });

    // 房源上移/下移
    area.querySelectorAll('.up, .down').forEach(btn => {
      btn.addEventListener('click', async () => {
        const gi = parseInt(btn.dataset.gi, 10), ii = parseInt(btn.dataset.ii, 10);
        const dir = btn.classList.contains('up') ? 'up' : 'down';
        try {
          const { pool, sha } = await readPool();
          const groups = splitGroups(pool);
          const g = groups[gi];
          const j = dir === 'up' ? ii - 1 : ii + 1;
          if (j < 0 || j >= g.items.length) return;
          [g.items[ii], g.items[j]] = [g.items[j], g.items[ii]];
          await writePool(groups.flatMap(x => x.items), sha);
          renderPool();
        } catch (e) { alert('调整失败：' + e.message); }
      });
    });
    // 小区组上移/下移
    area.querySelectorAll('.groupUp, .groupDown').forEach(btn => {
      btn.addEventListener('click', async () => {
        const gi = parseInt(btn.dataset.gi, 10);
        const dir = btn.classList.contains('groupUp') ? 'up' : 'down';
        try {
          const { pool, sha } = await readPool();
          const groups = splitGroups(pool);
          const j = dir === 'up' ? gi - 1 : gi + 1;
          if (j < 0 || j >= groups.length) return;
          [groups[gi], groups[j]] = [groups[j], groups[gi]];
          await writePool(groups.flatMap(x => x.items), sha);
          renderPool();
        } catch (e) { alert('调整失败：' + e.message); }
      });
    });
    // 移除
    area.querySelectorAll('.rm').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('从房源池移除该房源？')) return;
        const hc = btn.dataset.hc;
        try {
          const { pool, sha } = await readPool();
          await writePool(pool.filter(x => x.houseCode !== hc), sha);
          renderPool();
        } catch (e) { alert('移除失败：' + e.message); }
      });
    });
  }

  renderPool();
</script>
</body>
</html>
