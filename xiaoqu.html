<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小区档案</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "Microsoft YaHei", sans-serif; background: #1b1e24; color: #e8e9ec; padding: 24px; line-height: 1.7; }
  .wrap { max-width: 960px; margin: 0 auto; }
  h1 { font-size: 26px; color: #fff; }
  .sub { color: #a9adb8; font-size: 14px; margin-bottom: 20px; }
  .card { background: #262a32; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  .card h2 { font-size: 16px; color: #7ec8e3; margin-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td { padding: 6px 10px; border-bottom: 1px solid rgba(255,255,255,0.06); }
  td:first-child { color: #8a8d94; width: 100px; }
  .price { color: #f0c060; font-size: 22px; font-weight: bold; }
  .metro-recent { color: #7ec8e3; font-size: 15px; font-weight: bold; }
  .deal td { color: #a9adb8; }
  .house { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.06); flex-wrap: wrap; }
  .house img { width: 160px; height: 120px; object-fit: cover; border-radius: 8px; flex-shrink: 0; }
  .house { overflow-x: auto; }
  .gallery { display: flex; overflow-x: auto; gap: 12px; padding-bottom: 8px; }
  .gallery img { width: 200px; height: 150px; object-fit: cover; border-radius: 8px; cursor: pointer; flex-shrink: 0; }
  .gallery img:hover { opacity: 0.85; }
  .gallery::-webkit-scrollbar, .house::-webkit-scrollbar { height: 8px; }
  .gallery::-webkit-scrollbar-thumb, .house::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
  .back { display: inline-block; margin-bottom: 16px; color: #4fc3f7; text-decoration: none; font-size: 14px; }
  .tag { display: inline-block; background: rgba(255,255,255,0.1); border-radius: 4px; padding: 1px 8px; font-size: 12px; margin-right: 6px; color: #c9ccd3; }
  .card img { cursor: zoom-in; }
  #lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 9999; cursor: grab; overflow: hidden; }
  #lightbox img { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 92vw; height: 92vh; object-fit: contain; user-select: none; -webkit-user-drag: none; }
  #lightbox img:active { cursor: grabbing; }
  #lightbox .lb-hint { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); color: #c9ccd3; font-size: 12px; pointer-events: none; }
  #lightbox .lb-arrow { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 60px; line-height: 60px; text-align: center; font-size: 34px; color: #fff; background: rgba(255,255,255,0.1); border-radius: 6px; cursor: pointer; user-select: none; z-index: 10; }
  #lightbox .lb-arrow:hover { background: rgba(255,255,255,0.25); }
  #lightbox #lbPrev { left: 16px; }
  #lightbox #lbNext { right: 16px; }
  #lightbox .lb-count { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); color: #c9ccd3; font-size: 13px; }
</style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#10131a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="选房报告">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  #xqMap { height: 240px; border-radius: 12px; overflow: hidden; margin-bottom: 16px; border: 1px solid rgba(255,255,255,0.1); }
  #xqMap .marker-pin { width: 22px; height: 22px; background: #ff5a5f; border: 3px solid #fff; border-radius: 50%; box-shadow: 0 0 0 3px rgba(255,90,95,0.35); }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← 返回数据版</a>
  <div style="display:flex;gap:8px;margin:0 0 10px;align-items:center">
    <span id="userNameLabel" style="cursor:pointer;background:#262a32;color:#fff;padding:6px 12px;border-radius:16px;font-size:13px;border:1px solid rgba(255,255,255,0.2)">👤 未登录</span>
    <span id="adminLabel" style="cursor:pointer;background:#262a32;color:#fff;padding:6px 12px;border-radius:16px;font-size:13px;border:1px solid rgba(255,255,255,0.2)">🔒 管理员</span>
  </div>
  <div style="display:flex;gap:8px;margin:0 0 10px">
    <select id="districtSelect" style="flex:1;padding:11px 8px;border-radius:8px;border:1px solid rgba(255,255,255,0.2);background:#262a32;color:#fff;font-size:15px;outline:none">
      <option value="" style="color:#fff">📍 区</option>
    </select>
    <select id="boardSelect" style="flex:1;padding:11px 8px;border-radius:8px;border:1px solid rgba(255,255,255,0.2);background:#262a32;color:#fff;font-size:15px;outline:none">
      <option value="" style="color:#fff">🏘️ 板块</option>
    </select>
  </div>
  <select id="anzhiSelect" style="width:100%;padding:11px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.2);background:#262a32;color:#fff;font-size:16px;margin:0 0 10px;outline:none">
    <option value="all" style="color:#fff">🏘️ 全部小区</option>
    <option value="no" style="color:#fff">✅ 排除安置房</option>
    <option value="only" style="color:#fff">🔴 仅安置房</option>
  </select>
  <div id="tagFilterBox" style="margin:0 0 10px;font-size:13px;color:#a9adb8">🏷️ 标签筛选（我的）：加载中…</div>
  <select id="xqSelect" style="width:100%;padding:11px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.2);background:#262a32;color:#fff;font-size:16px;margin:0 0 18px;outline:none">
    <option value="" style="color:#fff">📂 选择小区查看报告…</option>
  </select>
  <div id="xqMap"></div>
  <h1 id="xqName">小区报告</h1>
  <div class="sub" id="xqSub"></div>
  <div id="content"></div>
</div>
<div id="lightbox"><img id="lightboxImg" src="" alt=""><div id="lbPrev" class="lb-arrow">‹</div><div id="lbNext" class="lb-arrow">›</div><div class="lb-count" id="lbCount"></div><div class="lb-hint">滚轮缩放 · 按住拖动 · 单击关闭</div></div>
<script>
  let curName = new URLSearchParams(location.search).get('name') || '';
  document.title = '小区报告';

  // ---- 云端备注配置（GitHub 存储）----
  const GITHUB_TOKEN = ['ghp_','w9uOaLY','MjlBSIM','ASAJ5Pz','UvKT31G','JP4E02RP'].join('');
  const GITHUB_REPO = 'threedaysmaybe/11_map_choose_house';
  const ADMIN_PWD = '593432'; // 管理员口令
  let isAdmin = localStorage.getItem('xq_isAdmin') === '1'; // 是否解锁管理员模式（记住登录）
  let myName = localStorage.getItem('xq_username') || ''; // 我的昵称
  let cloudTagMap = {}; // 当前小区云端标签 { houseCode: [{name,tag,time}] }
  let tagInclude = new Set(); // 标签筛选：包含
  let tagExclude = new Set(); // 标签筛选：排除（反选）
  let allTagRecords = []; // 所有小区标签记录 [{xiaoqu,houseCode,name,tag,time}]

  // GitHub 读备注
  async function ghReadNotes(name) {
    const path = 'data/notes/' + encodeURIComponent(name) + '.json';
    try {
      const r = await fetch('https://api.github.com/repos/' + GITHUB_REPO + '/contents/' + path, {
        headers: { Authorization: 'token ' + GITHUB_TOKEN, Accept: 'application/vnd.github.v3+json' },
      });
      if (r.status === 404) return { notes: [], sha: null };
      if (!r.ok) return { notes: [], sha: null };
      const d = await r.json();
      const json = JSON.parse(decodeURIComponent(escape(atob(d.content.replace(/\s/g, '')))));
      return { notes: json.notes || [], sha: d.sha };
    } catch (e) { return { notes: [], sha: null }; }
  }
  // GitHub 写备注
  async function ghWriteNotes(name, notes, sha) {
    const path = 'data/notes/' + encodeURIComponent(name) + '.json';
    const body = {
      message: '更新备注 ' + name,
      content: btoa(unescape(encodeURIComponent(JSON.stringify({ notes })))),
    };
    if (sha) body.sha = sha;
    const r = await fetch('https://api.github.com/repos/' + GITHUB_REPO + '/contents/' + path, {
      method: 'PUT',
      headers: { Authorization: 'token ' + GITHUB_TOKEN, Accept: 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!r.ok) throw new Error('保存失败 HTTP ' + r.status);
    return await r.json();
  }
  // GitHub 读标签
  async function ghReadTags(name) {
    const path = 'data/tags/' + encodeURIComponent(name) + '.json';
    try {
      const r = await fetch('https://api.github.com/repos/' + GITHUB_REPO + '/contents/' + path, {
        headers: { Authorization: 'token ' + GITHUB_TOKEN, Accept: 'application/vnd.github.v3+json' },
      });
      if (r.status === 404) return { tags: [], sha: null };
      if (!r.ok) return { tags: [], sha: null };
      const d = await r.json();
      const json = JSON.parse(decodeURIComponent(escape(atob(d.content.replace(/\s/g, '')))));
      return { tags: json.tags || [], sha: d.sha };
    } catch (e) { return { tags: [], sha: null }; }
  }
  // GitHub 写标签
  async function ghWriteTags(name, tags, sha) {
    const path = 'data/tags/' + encodeURIComponent(name) + '.json';
    const body = {
      message: '更新标签 ' + name,
      content: btoa(unescape(encodeURIComponent(JSON.stringify({ tags })))),
    };
    if (sha) body.sha = sha;
    const r = await fetch('https://api.github.com/repos/' + GITHUB_REPO + '/contents/' + path, {
      method: 'PUT',
      headers: { Authorization: 'token ' + GITHUB_TOKEN, Accept: 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!r.ok) throw new Error('保存失败 HTTP ' + r.status);
    return await r.json();
  }
  // GitHub 读所有小区标签（遍历 data/tags 目录）
  async function ghReadAllTags() {
    try {
      const listRes = await fetch('https://api.github.com/repos/' + GITHUB_REPO + '/contents/data/tags', {
        headers: { Authorization: 'token ' + GITHUB_TOKEN, Accept: 'application/vnd.github.v3+json' },
      });
      if (!listRes.ok) return [];
      const files = await listRes.json();
      if (!Array.isArray(files)) return [];
      const result = [];
      for (const f of files) {
        if (!f.name || !f.name.endsWith('.json')) continue;
        const xiaoqu = decodeURIComponent(f.name.replace(/\.json$/, ''));
        try {
          const r = await fetch(f.url, { headers: { Authorization: 'token ' + GITHUB_TOKEN, Accept: 'application/vnd.github.v3+json' } });
          const d = await r.json();
          const json = JSON.parse(decodeURIComponent(escape(atob(d.content.replace(/\s/g, '')))));
          for (const t of (json.tags || [])) result.push({ xiaoqu, ...t });
        } catch (e) {}
      }
      return result;
    } catch (e) { return []; }
  }

  let xiaoquCoords = [];
  let allFiles = []; // 缓存的小区列表（避免每次 change 都异步 fetch 导致下拉被关）
  // 同步渲染下拉（基于已缓存的数据，change 后立即完成，不会有异步窗口）
  function renderList() {
    try {
      const raw = allFiles;
      const distSel = document.getElementById('districtSelect');
      const boardSel = document.getElementById('boardSelect');
      const sel = document.getElementById('xqSelect');
      const anzhiSelect = document.getElementById('anzhiSelect');
      // 区下拉：只在首次填充（列表固定）
      if (distSel.options.length <= 1) {
        const districts = [...new Set(raw.map(x => x.district).filter(Boolean))].sort();
        distSel.innerHTML = '<option value="" style="color:#fff">📍 区（全部）</option>' + districts.map(d => `<option value="${d}" style="color:#fff">${d}</option>`).join('');
      }
      // 板块下拉（当前区的板块）
      const boards = [];
      for (const x of raw) {
        if (!x.board) continue;
        if (distSel.value && x.district !== distSel.value) continue;
        if (!boards.some(b => b.board === x.board)) boards.push({ board: x.board });
      }
      boards.sort((a, b) => (a.board || '').localeCompare(b.board || ''));
      boardSel.innerHTML = '<option value="" style="color:#fff">🏘️ 板块（全部）</option>' + boards.map(b => `<option value="${b.board}" style="color:#fff">${b.board}</option>`).join('');
      // 两级过滤 + 安置房
      let list = raw;
      if (distSel.value) list = list.filter(x => x.district === distSel.value);
      if (boardSel.value) list = list.filter(x => x.board === boardSel.value);
      const anzhiMode = anzhiSelect.value || 'all';
      list = anzhiMode === 'no' ? list.filter(x => !x.anzhi) : anzhiMode === 'only' ? list.filter(x => x.anzhi) : list;
      // 标签过滤（个人隔离）：筛选小区
      const myTags = allTagRecords.filter(t => isAdmin || t.name === myName);
      if (tagInclude.size) {
        const xqWithTag = new Set(myTags.filter(t => tagInclude.has(t.tag)).map(t => t.xiaoqu));
        list = list.filter(x => xqWithTag.has(x.name));
      }
      if (tagExclude.size) {
        const xqWithExcl = new Set(myTags.filter(t => tagExclude.has(t.tag)).map(t => t.xiaoqu));
        list = list.filter(x => !xqWithExcl.has(x.name));
      }
      xiaoquCoords = list;
      sel.innerHTML = '<option value="" style="color:#fff">📂 选择小区查看报告…</option>' + list.map(x => `<option value="${x.name}" style="color:#fff">${x.anzhi ? '🔴' : ''}${x.name}${x.board ? '（' + (x.district ? x.district + '·' : '') + x.board + '）' : ''}</option>`).join('');
      if (curName && list.some(x => x.name === curName)) sel.value = curName;
    } catch (e) {}
  }
  // 初始化：fetch 一次数据，缓存后渲染
  async function initList() {
    try {
      const r = await fetch('data/ke_xiaoqu/xiaoqu_list.json');
      const d = await r.json();
      allFiles = (d.files || []).slice().sort((a, b) => (a.district || '').localeCompare(b.district || '') || (a.board || '').localeCompare(b.board || '') || (a.name || '').localeCompare(b.name || ''));
    } catch (e) {}
    renderList();
    refreshTagFilter();
  }
  // 读所有小区标签，渲染筛选 chips（异步，不阻塞下拉）
  async function refreshTagFilter() {
    try {
      allTagRecords = await ghReadAllTags();
    } catch (e) {}
    const box = document.getElementById('tagFilterBox');
    if (!box) return;
    const myTags = allTagRecords.filter(t => isAdmin || t.name === myName);
    const allTagNames = [...new Set(myTags.map(t => t.tag))].sort();
    box.innerHTML = (isAdmin ? '🏷️ 标签筛选（全部）：' : '🏷️ 标签筛选（我的）：') + (allTagNames.length ? allTagNames.map(t => {
      const inc = tagInclude.has(t), exc = tagExclude.has(t);
      const st = inc ? 'inc' : exc ? 'exc' : 'none';
      const style = inc ? 'background:rgba(46,204,113,0.25);color:#2ecc71;border:1px solid #2ecc71' : exc ? 'background:rgba(231,76,60,0.2);color:#e74c3c;border:1px solid #e74c3c' : 'background:rgba(255,255,255,0.08);color:#c9ccd3;border:1px solid rgba(255,255,255,0.2)';
      return `<span class="tagChip" data-tag="${t}" data-state="${st}" style="display:inline-block;border-radius:12px;padding:3px 9px;font-size:12px;margin:3px 4px 3px 0;cursor:pointer;${style}">${inc ? '✓ ' : exc ? '✗ ' : ''}${t}</span>`;
    }).join('') : '<span style="color:#8b8f99">（暂无标签）</span>');
    box.querySelectorAll('.tagChip').forEach(chip => {
      chip.addEventListener('click', () => {
        const t = chip.dataset.tag, st = chip.dataset.state;
        if (st === 'none') { tagInclude.add(t); tagExclude.delete(t); }
        else if (st === 'inc') { tagInclude.delete(t); tagExclude.add(t); }
        else { tagExclude.delete(t); }
        renderList();
        refreshTagFilter();
        if (curName) load(curName);
      });
    });
    renderList();
  }
  document.getElementById('districtSelect').addEventListener('change', () => renderList());
  document.getElementById('boardSelect').addEventListener('change', () => renderList());
  document.getElementById('anzhiSelect').addEventListener('change', () => renderList());

  // ---- 2D 地图：定位小区在成都的位置 ----
  let xqMap = null, xqMarker = null;
  // WGS84 → GCJ02（高德瓦片是火星坐标系，小区坐标是 WGS84，需偏移）
  function wgs2gcj(lon, lat) {
    const a = 6378245.0, ee = 0.00669342162296594323;
    const tlat = (x, y) => { let r = -100 + 2*x + 3*y + 0.2*y*y + 0.1*x*y + 0.2*Math.sqrt(Math.abs(x)); r += (20*Math.sin(6*x*Math.PI) + 20*Math.sin(2*x*Math.PI))*2/3; r += (20*Math.sin(y*Math.PI) + 40*Math.sin(y/3*Math.PI))*2/3; r += (160*Math.sin(y/12*Math.PI) + 320*Math.sin(y*Math.PI/30))*2/3; return r; };
    const tlon = (x, y) => { let r = 300 + x + 2*y + 0.1*x*x + 0.1*x*y + 0.1*Math.sqrt(Math.abs(x)); r += (20*Math.sin(6*x*Math.PI) + 20*Math.sin(2*x*Math.PI))*2/3; r += (20*Math.sin(x*Math.PI) + 40*Math.sin(x/3*Math.PI))*2/3; r += (150*Math.sin(x/12*Math.PI) + 300*Math.sin(x/30*Math.PI))*2/3; return r; };
    let dlat = tlat(lon - 105, lat - 35), dlon = tlon(lon - 105, lat - 35);
    const rl = lat/180*Math.PI; let m = Math.sin(rl); m = 1 - ee*m*m; const sm = Math.sqrt(m);
    dlat = dlat*180/((a*(1-ee))/(m*sm)*Math.PI);
    dlon = dlon*180/(a/sm*Math.cos(rl)*Math.PI);
    return [lon + dlon, lat + dlat];
  }
  function initMap() {
    if (xqMap || !window.maplibregl) return;
    xqMap = new maplibregl.Map({
      container: 'xqMap',
      style: {
        version: 8,
        sources: {
          gaode: { type: 'raster', tiles: ['https://webrd01.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}'], tileSize: 256, attribution: '© 高德地图' }
        },
        layers: [{ id: 'gaode', type: 'raster', source: 'gaode' }]
      },
      center: wgs2gcj(104.066, 30.66),
      zoom: 11,
      attributionControl: { compact: true }
    });
  }
  function focusXiaoqu(lon, lat) {
    if (!xqMap || !lon || !lat) return;
    const gcj = wgs2gcj(lon, lat);
    if (!xqMarker) {
      const el = document.createElement('div');
      el.className = 'marker-pin';
      xqMarker = new maplibregl.Marker({ element: el }).setLngLat(gcj).addTo(xqMap);
    } else {
      xqMarker.setLngLat(gcj);
    }
    xqMap.flyTo({ center: gcj, zoom: 14 });
  }
  function locateByName(name) {
    const item = xiaoquCoords.find(x => x.name === name);
    if (item && item.lon && item.lat) focusXiaoqu(item.lon, item.lat);
  }

  async function load(n) {
    if (!n) { document.getElementById('content').innerHTML = '<div class="card">请在上方选择小区查看报告</div>'; document.getElementById('xqName').textContent = '小区报告'; document.getElementById('xqSub').textContent = ''; return; }
    const r = await fetch('data/ke_xiaoqu/' + encodeURIComponent(n) + '.json');
    const d = await r.json();
    const info = d.info || {};
    // 加载云端标签（个人隔离）
    cloudTagMap = {};
    const tagRes = await ghReadTags(n);
    for (const t of tagRes.tags) {
      (cloudTagMap[t.houseCode] = cloudTagMap[t.houseCode] || []).push(t);
    }
    document.getElementById('xqName').textContent = d.name || n;
    document.getElementById('xqSub').textContent = '抓取时间：' + (d.updatedAt || '').slice(0, 10);

    let html = '';
    // 概览
    html += `<div class="card"><h2>小区概览</h2><div class="price">${d.price || '?'} 元/㎡</div>`;
    if (d.note) html += `<div style="font-weight:bold;color:#ffe082;margin:10px 0;padding:8px 10px;background:rgba(255,224,130,0.12);border-left:3px solid #ffe082;border-radius:4px">📝 备注：${d.note}</div>`;
    // 云端备注区域（GitHub 存储，管理员看全部）
    html += `<div style="margin:8px 0;padding:8px 10px;background:rgba(255,255,255,0.04);border-radius:4px">`;
    html += `<div style="font-size:12px;color:#a9adb8;margin-bottom:4px">📝 云端备注（${isAdmin ? '管理员·显示全部' : '只看自己'}）</div>`;
    html += `<div style="margin-bottom:4px">昵称：<input id="noteNameInput" type="text" value="${myName}" placeholder="你的名字" style="width:110px;background:#f0f1f3;border:1px solid #d0d2d6;border-radius:4px;color:#2a2d35;padding:3px 6px;font-size:12px"></div>`;
    html += `<div id="notesList" style="margin-bottom:6px;color:#c9ccd3;font-size:12px">加载备注中…</div>`;
    html += `<textarea id="noteInput" rows="2" placeholder="写一条备注…" style="width:100%;background:#f0f1f3;border:1px solid #d0d2d6;border-radius:4px;color:#2a2d35;padding:4px 6px;font-size:12px;box-sizing:border-box"></textarea>`;
    html += `<button id="saveNoteBtn" style="margin-top:4px;background:#2e86de;border:none;border-radius:4px;color:#fff;padding:4px 12px;font-size:12px;cursor:pointer">保存备注</button>`;
    html += ` <a href="javascript:void(0)" id="adminToggle" style="color:#8b8f99;font-size:12px;margin-left:6px">${isAdmin ? '🔓 退出管理员' : '🔒 管理员解锁'}</a>`;
    html += `</div>`;
    const rows = [['建筑类型', info['建筑类型']], ['楼栋总数', info['楼栋总数']], ['房屋总数', info['房屋总数']], ['容积率', info['容积率']], ['绿化率', info['绿化率']], ['建成年代', info['建成年代']], ['交易权属', info['交易权属']], ['房屋性质', info['房屋性质']], ['停车费', info['停车费']], ['物业费', info['物业费']], ['开发商', info['开发商']]];
    html += '<table>' + rows.filter(([, v]) => v).map(([k, v]) => {
      let display = v;
      if (k === '交易权属') {
        // 按斜杠拆分，只给「拆迁/回迁(红)、公房(黄)」那一个标签标色
        display = v.split('/').map(tag => {
          if (/拆迁|回迁/.test(tag)) return `<span style="color:#e74c3c;font-weight:bold">${tag}</span>`;
          if (/公房/.test(tag)) return `<span style="color:#f0c060;font-weight:bold">${tag}</span>`;
          return tag;
        }).join('/');
      } else if (k === '容积率') {
        const r = parseFloat(v);
        if (!isNaN(r)) {
          const color = r < 2.8 ? '#2ecc71' : r < 4 ? '#f0c060' : '#e74c3c';
          display = `<span style="color:${color};font-weight:bold">${v}</span>`;
        }
      }
      return `<tr><td>${k}</td><td>${display}</td></tr>`;
    }).join('') + '</table></div>';

    // 地铁
    if (d.metro && d.metro.length) {
      const sorted = d.metro.slice().sort((a, b) => parseInt(a.distance) - parseInt(b.distance));
      html += `<div class="card"><h2>附近地铁</h2><div class="metro-recent">最近：${sorted[0].name} ${sorted[0].distance}（${sorted[0].lines}）</div>`;
      html += '<table>' + sorted.map(m => `<tr><td>${m.name}</td><td>${m.distance}</td><td>${m.lines}</td></tr>`).join('') + '</table></div>';
    }

    // 成交
    if (d.deals && d.deals.length) {
      html += `<div class="card"><h2>最近成交</h2><table><tr><td>面积</td><td>签约日期</td><td>成交价</td><td>成交单价</td></tr>`;
      html += d.deals.map(x => `<tr class="deal"><td>${x.面积}</td><td>${x.签约日期}</td><td>${x.成交价}</td><td>${x.成交单价}</td></tr>`).join('');
      html += '</table></div>';
    }

    // 房源（含户型图）
    if (d.houses && d.houses.length) {
      html += `<div class="card"><h2>在售房源（${d.houses.length} 套）</h2>`;
      d.houses.forEach(h => {
        const hc = h.houseCode || '';
        const hTags = (cloudTagMap[hc] || []).filter(t => isAdmin || t.name === myName).map(t => t.tag);
        if (tagInclude.size && ![...tagInclude].every(t => hTags.includes(t))) return;
        if (tagExclude.size && [...tagExclude].some(t => hTags.includes(t))) return;
        html += `<div class="house">`;
        const floors = h.totalFloors ? ` · 共${h.totalFloors}层` : '';
        let deFang = '';
        if (h.taoneiArea && h.area) {
          const rate = parseFloat(h.taoneiArea) / parseFloat(h.area) * 100;
          const color = rate >= 90 ? '#2ecc71' : rate >= 85 ? '#f0c060' : '#e74c3c';
          deFang = ` · <span style="color:${color};font-weight:bold">得房率 ${rate.toFixed(1)}%</span>`;
        }
        let tihuHtml = '';
        if (h.tihu) {
          const tm = h.tihu.match(/(\d+)梯(\d+)户/);
          if (tm) {
            const ti = parseInt(tm[1]), hu = parseInt(tm[2]);
            const ratio = hu / ti;
            const color = (hu <= 4 && ratio <= 2) ? '#2ecc71' : (hu <= 6 && ratio <= 2.5) ? '#f0c060' : '#e74c3c';
            tihuHtml = ` · <span style="color:${color};font-weight:bold">${h.tihu}</span>`;
          }
        }
        let structureTag = '';
        if (h.structure) {
          const scolor = h.structure === '框架结构' ? '#2ecc71' : '#f0c060';
          structureTag = `<span class="tag" style="color:${scolor};font-weight:bold">${h.structure}</span>`;
        }
        // 抵押信息：无抵押绿，有抵押红
        let diyaHtml = '';
        if (h.diya) {
          const dcolor = h.diya === '无抵押' ? '#2ecc71' : '#e74c3c';
          diyaHtml = `<span class="tag" style="color:${dcolor};font-weight:bold">${h.diya}</span>`;
        }
        // 产权所属：共有标黄
        let chanquanHtml = '';
        if (h.chanquan) {
          chanquanHtml = h.chanquan === '非共有' ? `<span class="tag" style="color:#2ecc71;font-weight:bold">${h.chanquan}</span>` : `<span class="tag" style="color:#f0c060;font-weight:bold">${h.chanquan}</span>`;
        }
        // 房屋用途：普通住宅绿，否则红
        let usageHtml = '';
        if (h.usage) {
          const ucolor = h.usage === '普通住宅' ? '#2ecc71' : '#e74c3c';
          usageHtml = `<span class="tag" style="color:${ucolor};font-weight:bold">${h.usage}</span>`;
        }
        // 其它普通字段
        const extraTags = [h.buildingType, h.huxingStructure, h.decoration, h.listTime ? '挂牌' + h.listTime : '', h.lastTrade ? '上次交易' + h.lastTrade : '', h.fangben].filter(Boolean).map(t => `<span class="tag">${t}</span>`).join('');
        const link = h.url ? `<a href="${h.url}" target="_blank" style="color:#4fc3f7;font-size:12px">🔗 贝壳</a>` : '';
        // 核心卖点：标黄加粗
        const spHtml = h.sellingPoint ? `<div style="color:#f0c060;font-weight:bold;font-size:12px;margin-top:4px;line-height:1.5">核心卖点：${h.sellingPoint}</div>` : '';
        // 信息放图片前面，单独一行
        html += `<div style="margin-bottom:6px;flex-basis:100%"><div style="color:#fff;font-weight:bold">${h.room || '?'} ${h.area || '?'}㎡${floors}${deFang}${tihuHtml}</div><div>总价 ${h.totalPrice || '?'}万 · ${h.unitPrice || '?'}元/平 ${link}</div><div><span class="tag">${h.orientation || '朝向?'}</span><span class="tag">${h.floor || '?'}楼层</span>${structureTag}${diyaHtml}${chanquanHtml}${usageHtml}${extraTags}</div>${spHtml}</div>`;
        // 标签（云端，个人隔离）
        const hTags3 = (cloudTagMap[hc] || []).filter(t => isAdmin || t.name === myName);
        const xqTagsHtml = hTags3.map(t => `<span style="display:inline-block;background:rgba(139,195,74,0.15);color:#9ccc65;border:1px solid rgba(139,195,74,0.4);border-radius:10px;padding:1px 8px;font-size:11px;margin:2px 4px 2px 0">${isAdmin ? t.name + '：' : ''}${t.tag}</span>`).join('');
        html += `<div style="margin-bottom:4px;flex-basis:100%">${xqTagsHtml}<a href="javascript:void(0)" class="xqAddTagBtn" data-hc="${hc}" style="color:#4fc3f7;font-size:12px;text-decoration:none">➕ 标签</a></div>`;
        if (h.localImages && h.localImages.length) html += h.localImages.map(img => `<img src="data/ke_xiaoqu/images/${encodeURIComponent(d.name || n)}/${img}">`).join('');
        html += `</div>`;
      });
      html += '</div>';
    }

    // 小区图片
    if (d.localImages && d.localImages.length) {
      html += `<div class="card"><h2>小区实景（${d.localImages.length} 张）</h2><div class="gallery">`;
      html += d.localImages.map(img => `<img src="data/ke_xiaoqu/images/${encodeURIComponent(d.name || n)}/${img}" loading="lazy">`).join('');
      html += '</div></div>';
    }

    document.getElementById('content').innerHTML = html;
    // ---- 加标签（云端）----
    document.querySelectorAll('.xqAddTagBtn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const hc = btn.dataset.hc;
        if (!myName) { alert('请先在上方填昵称'); return; }
        const tag = prompt('输入标签名：');
        if (!tag || !tag.trim()) return;
        try {
          const res = await ghReadTags(n);
          const tags = res.tags.concat([{ houseCode: hc, name: myName, tag: tag.trim(), time: new Date().toISOString() }]);
          await ghWriteTags(n, tags, res.sha);
          load(n);
        } catch (e) { alert(e.message); }
      });
    });
    // ---- 云端备注逻辑 ----
    let curSha = null;
    async function renderNotes() {
      const listEl = document.getElementById('notesList');
      if (!listEl) return;
      const res = await ghReadNotes(n);
      curSha = res.sha;
      const visible = isAdmin ? res.notes : res.notes.filter(x => x.name === myName);
      if (!visible.length) {
        listEl.innerHTML = isAdmin ? '（暂无备注）' : (myName ? '（你还没有备注）' : '（先填昵称，再写备注）');
        return;
      }
      listEl.innerHTML = visible.map(x => `<div style="margin:3px 0;padding:4px 6px;background:rgba(255,255,255,0.05);border-radius:4px">${isAdmin ? `<b style="color:#4fc3f7">${x.name}</b>：` : ''}${x.note} <span style="color:#8b8f99;font-size:10px">${(x.time || '').slice(0, 16).replace('T', ' ')}</span></div>`).join('');
    }
    renderNotes();
    // 昵称输入
    const nameInput = document.getElementById('noteNameInput');
    if (nameInput) nameInput.addEventListener('change', () => {
      myName = nameInput.value.trim();
      localStorage.setItem('xq_username', myName);
      renderNotes();
    });
    // 保存备注
    const saveBtn = document.getElementById('saveNoteBtn');
    if (saveBtn) saveBtn.addEventListener('click', async () => {
      const txt = document.getElementById('noteInput').value.trim();
      if (!myName) { alert('请先填昵称'); return; }
      if (!txt) { alert('请写备注内容'); return; }
      saveBtn.textContent = '保存中…'; saveBtn.disabled = true;
      try {
        const res = await ghReadNotes(n); // 重新读拿最新 sha
        const notes = res.notes.concat([{ name: myName, note: txt, time: new Date().toISOString() }]);
        await ghWriteNotes(n, notes, res.sha);
        document.getElementById('noteInput').value = '';
        saveBtn.textContent = '已保存 ✓';
        renderNotes();
      } catch (e) { alert('保存失败：' + e.message); saveBtn.textContent = '保存备注'; }
      saveBtn.disabled = false;
      setTimeout(() => saveBtn.textContent = '保存备注', 1200);
    });
    // 管理员解锁
    const adminToggle = document.getElementById('adminToggle');
    if (adminToggle) adminToggle.addEventListener('click', () => {
      if (isAdmin) { isAdmin = false; localStorage.setItem('xq_isAdmin', '0'); load(n); return; }
      const pwd = prompt('输入管理员口令：');
      if (pwd === ADMIN_PWD) { isAdmin = true; localStorage.setItem('xq_isAdmin', '1'); load(n); }
      else if (pwd !== null) alert('口令错误');
    });
  }
  document.getElementById('xqSelect').addEventListener('change', e => {
    const n = e.target.value;
    if (!n) { load(''); return; }
    history.replaceState(null, '', '?name=' + encodeURIComponent(n));
    load(n);
    locateByName(n);
  });
  initList().then(() => {
    initMap();
    locateByName(curName);
  });
  load(curName).catch(e => document.getElementById('content').innerHTML = '<div class="card">加载失败：' + e.message + '</div>');

  // ---- 顶部用户状态（昵称 + 管理员）----
  function updateUserBar() {
    const nameLabel = document.getElementById('userNameLabel');
    const adminLabel = document.getElementById('adminLabel');
    if (nameLabel) nameLabel.textContent = myName ? ('👤 ' + myName) : '👤 未登录';
    if (adminLabel) { adminLabel.textContent = isAdmin ? '🔓 管理员' : '🔒 管理员'; adminLabel.style.color = isAdmin ? '#f0c060' : '#fff'; }
  }
  updateUserBar();
  document.getElementById('userNameLabel').addEventListener('click', () => {
    const v = prompt('输入你的昵称：', myName);
    if (v !== null && v.trim()) { myName = v.trim(); localStorage.setItem('xq_username', myName); updateUserBar(); load(curName); }
  });
  document.getElementById('adminLabel').addEventListener('click', () => {
    if (isAdmin) { isAdmin = false; localStorage.setItem('xq_isAdmin', '0'); updateUserBar(); load(curName); return; }
    const pwd = prompt('输入管理员口令：');
    if (pwd === ADMIN_PWD) { isAdmin = true; localStorage.setItem('xq_isAdmin', '1'); updateUserBar(); load(curName); }
    else if (pwd !== null) alert('口令错误');
  });

  // ---- 图片灯箱：点击放大 + 滚轮缩放 + 按住拖动 + 单击关闭 ----
  const lb = document.getElementById('lightbox');
  const lbImg = document.getElementById('lightboxImg');
  let st = { scale: 1, tx: 0, ty: 0, dragging: false, moved: false, sx: 0, sy: 0, startTx: 0, startTy: 0 };
  function apply() {
    lbImg.style.transform = `translate(calc(-50% + ${st.tx}px), calc(-50% + ${st.ty}px)) scale(${st.scale})`;
  }
  let lbSrcs = [], lbIndex = 0;
  function showImage() {
    lbImg.src = lbSrcs[lbIndex];
    st = { scale: 1, tx: 0, ty: 0, dragging: false, moved: false, sx: 0, sy: 0, startTx: 0, startTy: 0 };
    apply();
    document.getElementById('lbCount').textContent = (lbIndex + 1) + ' / ' + lbSrcs.length;
    document.getElementById('lbPrev').style.display = lbIndex > 0 ? 'block' : 'none';
    document.getElementById('lbNext').style.display = lbIndex < lbSrcs.length - 1 ? 'block' : 'none';
  }
  function openLightbox(srcs, index) {
    lbSrcs = srcs || []; lbIndex = index || 0;
    showImage();
    lb.style.display = 'block';
  }
  function closeLightbox() { lb.style.display = 'none'; }
  function lbPrev() { if (lbIndex > 0) { lbIndex--; showImage(); } }
  function lbNext() { if (lbIndex < lbSrcs.length - 1) { lbIndex++; showImage(); } }
  document.getElementById('lbPrev').addEventListener('click', e => { e.stopPropagation(); lbPrev(); });
  document.getElementById('lbNext').addEventListener('click', e => { e.stopPropagation(); lbNext(); });
  // 点击图片打开（事件委托：收集同组图片）
  document.getElementById('content').addEventListener('click', e => {
    if (e.target.tagName !== 'IMG') return;
    const imgs = [...e.target.parentElement.querySelectorAll('img')];
    const srcs = imgs.map(i => i.src);
    openLightbox(srcs, srcs.indexOf(e.target.src));
  });
  // 滚轮缩放
  lb.addEventListener('wheel', e => {
    e.preventDefault();
    st.scale *= (e.deltaY < 0 ? 1.12 : 0.89);
    st.scale = Math.max(0.4, Math.min(6, st.scale));
    apply();
  }, { passive: false });
  // 按住拖动
  lbImg.addEventListener('mousedown', e => {
    st.dragging = true; st.moved = false;
    st.sx = e.clientX; st.sy = e.clientY;
    st.startTx = st.tx; st.startTy = st.ty;
    e.preventDefault();
  });
  window.addEventListener('mousemove', e => {
    if (!st.dragging) return;
    const dx = e.clientX - st.sx, dy = e.clientY - st.sy;
    if (Math.abs(dx) + Math.abs(dy) > 3) st.moved = true;
    st.tx = st.startTx + dx; st.ty = st.startTy + dy;
    apply();
  });
  window.addEventListener('mouseup', () => { st.dragging = false; });
  // 单击关闭（纯点击，非拖拽）
  lb.addEventListener('click', e => {
    if (e.target !== lbImg && !st.moved) closeLightbox();
  });
  lbImg.addEventListener('click', e => {
    if (!st.moved) closeLightbox();
    else st.moved = false;
  });
  // Esc 关闭
  window.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeLightbox();
    else if (e.key === 'ArrowLeft') lbPrev();
    else if (e.key === 'ArrowRight') lbNext();
  });
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
</script>
</body>
</html>
